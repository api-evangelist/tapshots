name: Tapshots
description: Tapshot, Inc. (marketed as Videokits) is a Cupertino, California company founded in 2012 that
  builds a mobile-first video capture and survey platform. Its Videokits Pro apps guide users through
  structured "kits" of survey questions and shot lists to capture video interviews and NPS/demographic
  survey responses in the field, then upload them to a web portal for storage, transcoding, streaming, and
  analysis. The company was surfaced as a 500 Global portfolio company and added to the API Evangelist
  network for enrichment. As of this pass the public website (videokits.com) does not respond and no
  developer/API surface (OpenAPI, SDK, developer portal, or GitHub organization) could be found; the
  iOS/iPad app was last updated June 2023, indicating a dormant product.
